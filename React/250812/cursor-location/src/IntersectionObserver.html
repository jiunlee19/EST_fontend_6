<body>
  <script>
    const option = {
      root: null, // 뷰 포트 root 기준
      threshold: 0, // 타겟 요소가 얼마나 겹칠 때 작동할지 설정
    }

    const callback = (entries) => {
      entries.forEach((entry) => {
        //실제 개발할 때 여기에 원하는 동작 코드
        console.log(entry);
      })
    }

    const observer = new IntersectionObserver(callback, option);

    //관찰할 요소 저장

    // 타겟 관찰 종료
    observer.unobserve(target);

    // 모든 요소에 대한 observe 중지
    observe.disconnect();
  </script>
