<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redux State Management</title>
  <style>
    @font-face {
      font-family: 'YoonChildfundkoreaManSeh';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408@1.0/YoonChildfundkoreaManSeh.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'S-CoreDream-3Light';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-3Light.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'MaruBuri';
      src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.eot);
      src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.eot?#iefix) format("embedded-opentype"), url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2) format("woff2"), url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff) format("woff"), url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.ttf) format("truetype");
    }

    @font-face {
      font-family: 'PFStardustS';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/PFStardustS.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'JHaebaragi-Medium-KO';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/JHaebaragi-Medium-KO.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    body {
      font-family: sans-serif;
      padding: 10px;
    }

    .font-hand {
      font-family: 'YoonChildfundkoreaManSeh';
    }

    .font-gothic {
      font-family: 'S-CoreDream-3Light';
    }

    .font-batang {
      font-family: 'MaruBuri';
    }

    .font-pixel {
      font-family: 'JHaebaragi-Medium-KO';
    }

    .font-rect {
      font-family: 'JHaebaragi-Medium-KO';
    }

    #box-group {
      width: 95vw;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: space-between;
    }

    .text-box {
      border-width: 2px;
      border-style: solid;

      width: 25vw;
      height: 150px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease-in-out;
    }
  </style>
</head>

<body>
  <input type="text" name="input-text" id="input-text">
  <button id="click">Click Me!</button>

  <div class="border-radius-btns">
    <button id="radius">Rounded!</button>
    <button id="circle">Circle!</button>
    <button id="rectangle">Rect!</button>
  </div>
  <div class="border-color-btns">
    <button id="red">Red!</button>
    <button id="green">Green!</button>
    <button id="blue">Blue!</button>
  </div>

  <div id="box-group">
    <div class="text-box"></div>
    <div class="text-box font-hand"></div>
    <div class="text-box font-gothic"></div>
    <div class="text-box font-batang"></div>
    <div class="text-box font-pixel"></div>
    <div class="text-box font-rect"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/redux/4.2.0/redux.js"></script>

  <script>
    // ===== DOM 요소 선택 =====
    const textInput = document.querySelector('#input-text');
    const clickBtn = document.querySelector('#click');
    const radiusContainer = document.querySelector('.border-radius-btns');
    const colorContainer = document.querySelector('.border-color-btns');
    const textBoxes = document.querySelectorAll('.text-box');

    // ===== Redux 설정 =====

    // 2. 초기 상태 (Single Source of Truth)
    // 앱의 모든 상태를 하나의 객체로 관리
    const initialState = {
      text: '',
      borderRadius: '0px',
      borderColor: 'lightskyblue'
    };

    // 3. Action Types (어떤 동작을 할지 정의하는 이름)
    const CHANGE_TEXT = 'CHANGE_TEXT';
    const CHANGE_BORDER_RADIUS = 'CHANGE_BORDER_RADIUS';
    const CHANGE_BORDER_COLOR = 'CHANGE_BORDER_COLOR';

    // 4. Action Creators (어떤 액션을 할지 구체화하는 함수)
    // type과 함께 필요한 데이터(payload)를 담아 반환
    const changeText = (text) => ({type: CHANGE_TEXT, payload: text});
    const changeBorderRadius = (radius) => ({type: CHANGE_BORDER_RADIUS, payload: radius});
    const changeBorderColor = (color) => ({type: CHANGE_BORDER_COLOR, payload: color});

    // 5. Reducer (상태를 어떻게 바꿀지 결정하는 순수 함수)
    // 이전 상태(state)와 액션(action)을 받아 새로운 상태를 반환
    function reducer(state = initialState, action) {
      switch (action.type) {
        case CHANGE_TEXT:
          return {...state, text: action.payload};
        case CHANGE_BORDER_RADIUS:
          return {...state, borderRadius: action.payload};
        case CHANGE_BORDER_COLOR:
          return {...state, borderColor: action.payload};
        default:
          return state;
      }
    }

    // 6. Store (상태가 저장되는 단 하나의 공간)
    const store = Redux.createStore(reducer);

    // ===== UI 렌더링 및 이벤트 연결 =====

    // 7. Render 함수 (상태에 맞춰 UI를 그리는 함수)
    // Redux 상태가 변경될 때마다 호출되어 화면을 다시 그림
    function render() {
      const state = store.getState(); // 현재 상태를 가져옴
      textBoxes.forEach(box => {
        box.textContent = state.text;
        box.style.borderRadius = state.borderRadius;
        box.style.borderColor = state.borderColor;
      });
    }

    // 8. Subscribe (상태 변경 감지)
    // store의 상태가 바뀔 때마다 render 함수를 실행하도록 등록
    store.subscribe(render);
    render(); // 초기 렌더링

    // 9. Dispatch (상태 변경 요청)
    // 이벤트 리스너는 이제 DOM을 직접 조작하는 대신, 액션을 Store에 보냄
    clickBtn.addEventListener("click", () => {
      store.dispatch(changeText(textInput.value));
    });

    radiusContainer.addEventListener("click", (e) => {
      if (e.target.tagName !== 'BUTTON') return;

      const id = e.target.id;
      let radiusValue = '0px';
      if (id === "radius") radiusValue = "10px";
      else if (id === "circle") radiusValue = "50%";

      store.dispatch(changeBorderRadius(radiusValue));
    });

    colorContainer.addEventListener("click", (e) => {
      if (e.target.tagName !== 'BUTTON') return;

      const colorValue = e.target.id;
      store.dispatch(changeBorderColor(colorValue));
    });

  </script>
</body>

</html>
