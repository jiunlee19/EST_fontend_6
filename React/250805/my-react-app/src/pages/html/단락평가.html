<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단락평가</title>
</head>

<body>
  <!-- 
    # 단락평가: && 연산자나 || 연산자를 사용하여 조건에 따라 결과값 반환하는 방법 
  -->
  <script>
    // 앞에 값이 true가 나오고 OR연산자(||)가 나오면 뒤에 값을 볼 필요 없음
    console.log(true || 'Hello');
    // 앞에 값이 false가 나오고 AND연산자(&&)가 나오면 뒤에 값을 볼 필요 없음
    console.log(false || 'Hello');

    const one = 10;
    const two = 20;
    const three = one || two;
    console.log('three=', three);
    // one의 값인 10 출력됨

    //---
    // 위와 같은 수식을 어떨 때 사용하냐면
    // 1. ||는 주로 변수가 비어있는지를 확인할 때 사용합니다.

    const userName = '';
    const userName2 = userName || 'Guest';
    console.log(userName2); // 'Guest'가 출력됩니다.

    // 2. &&는 주로 앞에 있는 값이 true일 때 실행하고 싶은 코드가 있을 때 사용합니다.
    // 2번 같은 경우에는 조건문이라고 생각하셔도 됩니다.
    // 리엑트에서는 주로 조건부 렌더링에 사용됩니다.
    const isLoggedIn = true;
    const greeting = isLoggedIn && 'Welcome back!';
    console.log(greeting); // 'Welcome back!'가 출력됩니다.

    //--- && 여러번 사용 권장하지 않음 
    const hello1 = true;
    const hello2 = true;
    const hello3 = true;
    let hello4 = 'hello';
    //1
    if (hello1) {
      if (hello2) {
        if (hello3) {
          hello4 = '1';
        }
      }
    }
    console.log(hello4);

    //2
    hello1 && hello2 && hello3 && (hello4 = '2');
    console.log(hello4);

    //3 (강사님 추천)
    hello4 = hello1 && hello2 && hello3 && '3';
    console.log(hello4);

  </script>
</body>

</html>
