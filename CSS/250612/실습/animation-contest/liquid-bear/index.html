<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>liquid Bear</title>
        <link rel="stylesheet" href="./index.css" />
        <link rel="stylesheet" href="./reset.css" />
    </head>
    <body>
        <div class="container">
            <p class="start-saying">곰돌이 얼굴에 커서를 올려보세요</p>
            <div class="bear">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="hat"></div>

                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="snout"></div>
                <div class="nose"></div>
            </div>
            <ul>
                <li>
                    <input type="checkbox" id="coconut" hidden />
                    <label for="coconut" class="coconut-btn">코코넛</label>
                    <img src="./img/코코넛워터.png" alt="코코넛" />
                </li>
                <li>
                    <input type="checkbox" id="sunglass" hidden>
                    <label for="sunglass" class="sunglass-btn">선글라스</label>
                    <img src="./img/선글라스.png" alt="선글라스">
                </li>
                <li>
                    <input type="checkbox" id="cherry" hidden>
                    <label for="cherry" class="cherry-btn">체리</label>
                    <img src="./img/체리.png" alt="체리">
                </li>
                <li>
                    <input type="checkbox" id="flower-necklace" hidden >
                    <label for="flower-necklace" class="flower-necklace-btn">꽃목걸이</label>
                    <img src="./img/꽃목걸이.png" alt="꽃목걸이">
                </li>
            </ul>
            <iframe width="0" height="0" src="https://www.youtube.com/embed/vcRbryMY-KI?si=1LkSG9KM1PkEAzya&amp;autoplay=1&mute=1;" title="YouTube video player" frameborder="0" allow="autoplay;" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</iframe>

        </div>
    </body>
</html>
